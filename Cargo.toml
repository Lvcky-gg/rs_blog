[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = {version = "1", features = ["full"]}
serde = {version ="1.0", features = ["derive"]}
sqlx = {version ="0.8", features =["postgres","runtime-tokio","macros"]}
dotenvy = "0.15.7"
askama = "0.13"
askama_web = { version = "0.13", features = ["axum-0.8"] }